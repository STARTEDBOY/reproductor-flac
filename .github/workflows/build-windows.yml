name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 mutagen numpy pyinstaller

      - name: Build portable app
        run: |
          python -m PyInstaller --noconfirm --clean reproductor-flac.spec

      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/ReproductorFLAC/* -DestinationPath ReproductorFLAC-windows-portable.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReproductorFLAC-windows-portable
          path: ReproductorFLAC-windows-portable.zip
